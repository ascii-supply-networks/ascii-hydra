[dependencies]
python = ">=3.12, <3.15"
pip = ">=24.2"

[environments]
ci = { features = ["ci"], solve-group = "ci" }
example = { features = ["ci", "example"], solve-group = "example" }

[feature.ci.dependencies]
pytest = ">=8.4.2,<9"
pytest-mock = ">=3.15.0,<4"
pytest-cov = "~=7"
ruff = ">=0.13.0,<1"
yamllint = ">=1.37.1,<2"
taplo = ">=0.10,<0.11"
nodejs = ">=20.8.1,<25"

[feature.ci.pypi-dependencies]
moto = "~=5.1.2"
nbqa = "~=1.9.0"
pandas-stubs = "~=2.3.2.250827"
pyrefly = ">=0.27.2,<1"
mypy-boto3-resourcegroupstaggingapi = "~=1.40.17"

[feature.example.dependencies]
grpcio = "*"
grpcio-tools = "*"
pyspark = "~=3.5.5"
openjdk = "~=17.0.15"
fsspec = ">=2025.9.0"
s3fs = ">=2025.9.0"
dagster = ">=1.11.10,<1.12"
dagster-webserver = ">=1.11.10,<1.12"
dagster-pipes = ">=1.11.10,<1.12"

[feature.example.pypi-dependencies]
tenacity = ">=9.1.2,<10"
dagster-aws = ">=0.27.10,<0.28"
dagster-pyspark = ">=0.27.10,<0.28"
dagster-databricks = ">=0.27.10,<0.28"

delta-spark = "~=3.3.2"
deltalake = "~=1.1.4"
build = "~=1.3.0"
databricks-sdk = ">=0.41,<0.67"
ascii_library = "*"             # if you want to compile instead of install last stable version { path = "src/pipelines/ascii_library", editable = true }


[project]
name = "ascii-hydra-sample"
version = "1.0.0"
description = "Showcase orchestrator money saving spark"
authors = [
  "Georg Heiler <georg.heiler@ascii.ac.at>",
  "Hernan Picatto <hernan.picatto@ascii.ac.at>",
]
platforms = ["linux-64", "osx-arm64"]
channels = ["conda-forge"]

[feature.ci.tasks.clean_all_environments]
cmd = "rm -rf .pixi/envs"
description = "remove environments"

[feature.ci.tasks.lint]
cmd = "ruff check ./src/pipelines && taplo check"
description = "Lint the basics"

[feature.example.tasks.test]
cmd = "pytest --cov --cov-report=term-missing ."
description = "Unittests"

[feature.example.tasks.start]
cwd = "src/pipelines/ascii_library_demo/pipeline_example"
cmd = "dagster dev -m pipeline_example"
description = "start dagster webserver UI"

[feature.ci.tasks.fmt]
cmd = "ruff format ./src && ruff check --fix ./src/pipelines && taplo fmt"
description = "Format python files"
env = { RUST_LOG = "warn" }

[tasks.create_environment]
cmd = "pixi install -e example --locked"
description = "python pipeline enviornment"
